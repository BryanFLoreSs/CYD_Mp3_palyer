[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 115200
extra_scripts = post:tools/rom_upload.py
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  bodmer/TJpg_Decoder@1.1.0
  https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_RGB_ORDER=TFT_BGR
  -D TFT_INVERSION_OFF=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D USE_HSPI_PORT=1
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
